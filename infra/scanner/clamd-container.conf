DatabaseDirectory /var/lib/clamav
CVDCertsDirectory /etc/clamav/certs
TCPSocket 3310
TCPAddr 0.0.0.0
LocalSocket /tmp/clamd.sock
Foreground yes
MaxThreads 2
MaxQueue 16
ConcurrentDatabaseReload no
StreamMaxLength 262144000
MaxFileSize 262144000
MaxScanSize 536870912
MaxScanTime 60000
MaxRecursion 10
MaxFiles 1000
AlertExceedsMax yes
AlertEncrypted yes
ReadTimeout 30
CommandReadTimeout 10
LogTime yes
LogClean no
