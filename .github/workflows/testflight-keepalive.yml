name: Keep TestFlight Build Active

on:
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: testflight-keepalive
  cancel-in-progress: false

jobs:
  renew-if-stale:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Check whether the iOS release source has been inactive for 55 days
        id: inactivity
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "$(git status --porcelain)" ]]; then
            echo "The checkout is not clean; refusing to continue."
            exit 1
          fi
          git fetch --prune origin main
          git fetch --tags origin
          git checkout -B main origin/main
          audited_head="$(git rev-parse origin/main)"
          native_head="$(git log -1 --format=%H "$audited_head" -- native/Scanner)"
          if [[ -z "$native_head" ]]; then
            echo "No scanner history found; refusing to continue."
            exit 1
          fi
          latest_commit_epoch="$(git show -s --format=%ct "$native_head")"
          # Website changes no longer create iOS builds and cannot reset this clock.
          # Only a guarded empty release on main can count as a renewal source.
          while IFS= read -r release_tag; do
            release_head="${release_tag#testflight-keepalive-}"
            if [[ ! "$release_head" =~ ^[0-9a-f]{40}$ ]] ||
              [[ "$(git rev-parse "refs/tags/$release_tag")" != "$release_head" ]] ||
              ! git merge-base --is-ancestor "$release_head" "$audited_head" ||
              [[ "$(git log -1 --format=%B "$release_head")" != "chore(release): keep TestFlight build active" ]] ||
              ! git diff --quiet "$release_head^" "$release_head"; then
              echo "Invalid keepalive release tag; refusing to continue."
              exit 1
            fi
            release_epoch="$(git show -s --format=%ct "$release_head")"
            if (( release_epoch > latest_commit_epoch )); then
              latest_commit_epoch="$release_epoch"
            fi
          done < <(git tag --list 'testflight-keepalive-*')
          now_epoch="$(date -u +%s)"
          age_seconds="$((now_epoch - latest_commit_epoch))"
          threshold_seconds="$((55 * 86400))"

          if (( age_seconds < 0 )); then
            echo "Latest commit is dated in the future; refusing to push."
            exit 1
          fi
          age_days="$((age_seconds / 86400))"
          echo "iOS release source has been inactive for ${age_days} full days."
          echo "inactive_days=$age_days" >> "$GITHUB_OUTPUT"
          echo "audited_head=$audited_head" >> "$GITHUB_OUTPUT"
          if (( age_seconds < threshold_seconds )); then
            echo "should_push=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "should_push=true" >> "$GITHUB_OUTPUT"

      - name: Audit and trigger a new TestFlight build
        if: steps.inactivity.outputs.should_push == 'true'
        env:
          AUDITED_HEAD: ${{ steps.inactivity.outputs.audited_head }}
        shell: bash
        run: |
          set -euo pipefail

          git fetch --prune origin main
          local_head="$(git rev-parse HEAD)"
          remote_head="$(git rev-parse origin/main)"
          if [[ "$local_head" != "$remote_head" || "$remote_head" != "$AUDITED_HEAD" ]]; then
            echo "main changed during this run; refusing to push."
            exit 1
          fi
          if ! git diff --quiet || ! git diff --cached --quiet || [[ -n "$(git status --porcelain)" ]]; then
            echo "The checkout has file changes; refusing to push."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore(release): keep TestFlight build active"

          if [[ "$(git rev-parse HEAD^)" != "$remote_head" ]]; then
            echo "The release commit has the wrong parent; refusing to push."
            exit 1
          fi
          if ! git diff --quiet HEAD^ HEAD; then
            echo "The release commit is not empty; refusing to push."
            exit 1
          fi
          if ! git diff --quiet || ! git diff --cached --quiet || [[ -n "$(git status --porcelain)" ]]; then
            echo "The checkout changed while creating the release commit; refusing to push."
            exit 1
          fi
          if git log -1 --format=%B | grep -Eiq '^[[:space:]]*Co-Authored-By[[:space:]]*:'; then
            echo "The release commit contains a prohibited attribution trailer."
            exit 1
          fi
          if [[ "$(git log -1 --format=%B)" != "chore(release): keep TestFlight build active" ]]; then
            echo "The release commit has an unexpected message; refusing to push."
            exit 1
          fi

          release_head="$(git rev-parse HEAD)"
          release_tag="testflight-keepalive-${release_head}"
          git tag "$release_tag" "$release_head"
          if [[ "$(git rev-parse "refs/tags/$release_tag")" != "$release_head" ]]; then
            echo "The release tag has the wrong target; refusing to push."
            exit 1
          fi
          # The native-folder filter excludes empty commits. This dedicated tag
          # triggers the same Xcode Cloud archive/distribution workflow instead.
          # Atomic, non-force push rejects a racing main/tag update as a unit.
          git push --atomic origin HEAD:main "refs/tags/$release_tag:refs/tags/$release_tag"
