name: GDGScanner
options:
  bundleIdPrefix: dev.gdggt
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_TEAM: 7THP95SRTV
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 2
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
configs:
  Debug: debug
  Release: release
  Wallet: release
targets:
  GDGScanner:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.gdggt.scanner
        TARGETED_DEVICE_FAMILY: '1'
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: Scanner.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Wallet:
          CODE_SIGN_ENTITLEMENTS: ScannerWallet.entitlements
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: WALLET_VAS
    scheme:
      testTargets: [GDGScannerTests]
  GDGScannerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: GDGScanner
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.gdggt.scanner.tests
schemes:
  GDGScannerWallet:
    build:
      targets:
        GDGScanner: all
    run:
      config: Wallet
    archive:
      config: Wallet
