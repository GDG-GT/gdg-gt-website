plugins { id 'com.android.application' }
android {
    namespace 'dev.gdggt.workspace'
    compileSdk 35
    defaultConfig { applicationId 'dev.gdggt.workspace'; minSdk 28; targetSdk 35; versionCode 1; versionName '1.0.0'; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
    signingConfigs {
        release {
            if (System.getenv('GDG_ANDROID_KEYSTORE')) {
                storeFile file(System.getenv('GDG_ANDROID_KEYSTORE'))
                storePassword System.getenv('GDG_ANDROID_STORE_PASSWORD')
                keyAlias 'gdg-workspace'
                keyPassword System.getenv('GDG_ANDROID_STORE_PASSWORD')
            }
        }
    }
    buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildFeatures { buildConfig true }
    testOptions { unitTests.returnDefaultValues = true }
    lint { abortOnError true; checkReleaseBuilds true }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'com.google.android.material:material:1.12.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
